<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brittle ice spleef arena</title>
    <link rel="icon" type="image/png" href="brittle_ice.png">

    <style>
        /* Set the icy palette and center the card */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background: #262B40;
            color: #EEF7FF;
            font: 16px/1.6 system-ui, sans-serif;
        }

        /* Place the video beside the card on wider screens */
        .layout {
            width: 100%;
            max-width: 1120px;
            display: grid;
            grid-template-columns: minmax(0, 480px) minmax(0, 1fr);
            gap: 32px;
            align-items: center;
        }

        /* Match the video frame to the icy card */
        iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 200px;
            border: 1px solid #52617A;
            border-radius: 16px;
            background: #222A3D;
        }

        /* Stack the video below the card on smaller screens */
        @media (max-width: 850px) {
            .layout {
                max-width: 480px;
                grid-template-columns: 1fr;
            }
        }

        /* Give the card a quiet border and soft shadow */
        main {
            width: 100%;
            max-width: 480px;
            padding: clamp(24px, 6vw, 40px);
            background: #303951;
            border: 1px solid #52617A;
            border-radius: 20px;
            box-shadow: 0 24px 64px #11182740;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -.5px;
            color: #A5E5F5;
        }

        h2 {
            margin: 28px 0 8px;
            font-size: 18px;
        }

        p {
            margin: 8px 0;
        }

        .muted,
        .unit {
            color: #B9CADD;
        }

        /* Keep labels, inputs and units aligned */
        .dimensions {
            display: grid;
            gap: 16px;
            margin-top: 24px;
        }

        .dimension {
            display: grid;
            grid-template-columns: 1fr 110px auto;
            gap: 12px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #70829C;
            border-radius: 8px;
            background: #222A3D;
            color: #EEF7FF;
            font: inherit;
        }

        :focus-visible {
            outline: 3px solid #A5E5F5;
            outline-offset: 3px;
        }

        /* Make the calculated size the main highlight */
        .preview {
            margin: 28px 0 24px;
            padding: 20px;
            border: 1px solid #52617A;
            border-radius: 12px;
            background: #222A3D;
        }

        .size {
            color: #A5E5F5;
            font-size: 26px;
            font-weight: 650;
        }

        /* Style the main action */
        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #A5E5F5;
            color: #172536;
            font: 600 16px system-ui, sans-serif;
            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="layout">
        <main>
            <!-- Introduce the generator -->
            <header>
                <h1>Brittle ice spleef arena</h1>
            </header>

            <!-- Collect the requested outer dimensions -->
            <section aria-labelledby="desired-size">
                <h2 id="desired-size">Desired size</h2>
                <p class="muted">
                    The actual size depends on multiples of the tiles, so exact sizes are not always possible. We'll use
                    the closest available size.
                </p>

                <div class="dimensions">
                    <div class="dimension">
                        <label for="width">Width</label>
                        <input id="width" type="number" min="18" step="7" value="25">
                        <span class="unit">blocks</span>
                    </div>
                    <div class="dimension">
                        <label for="height">Height</label>
                        <input id="height" type="number" min="11" step="7" value="11">
                        <span class="unit">blocks</span>
                    </div>
                    <div class="dimension">
                        <label for="length">Length (cheap side)</label>
                        <input id="length" type="number" min="31" step="9" value="40">
                        <span class="unit">blocks</span>
                    </div>
                </div>
            </section>

            <!-- Show the closest dimensions without changing the requested values -->
            <section class="preview" aria-label="Closest available size" aria-live="polite">
                <p>Closest available size (width × height × length):</p>
                <p class="size">— × — × — blocks</p>
                <p id="size-details" class="muted"></p>
            </section>

            <button id="download">Download schematic</button>
            <p id="status" class="muted" role="status"></p>

        </main>

        <!-- Show the temporary video beside the generator -->
        <aside aria-label="Video">
            <iframe src="https://www.youtube-nocookie.com/embed/vPbpE_p4FO4?t=954?autoplay=0"
                title="Video creating this contraption" allow="encrypted-media; fullscreen; picture-in-picture"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>
        </aside>
    </div>

    <script type="module">
        // Keep the fixed dimensions and tile increments together
        const wBase = 11, wSlice = 7;
        const lBase = 22, lSlice = 9;
        const hBase = 2 + 2, hSlice = 7; // Include the vertical overlap allowance

        // Find the controls and track whether generation can start
        const inputs = ['width', 'height', 'length'].map(id => document.getElementById(id));
        const preview = document.querySelector('.size');
        const details = document.getElementById('size-details');
        const download = document.getElementById('download');
        const status = document.getElementById('status');
        let ready = false;
        let failed = false;
        let busy = false;
        let pendingRequest = null;
        let tileCounts = null;

        // Derive input limits from one tile in each direction
        const rules = [[wBase, wSlice], [hBase, hSlice], [lBase, lSlice]];
        inputs.forEach((input, i) => {
            input.min = rules[i][0] + rules[i][1];
            input.step = rules[i][1];
        });

        function updateButton() {
            download.disabled = failed || busy || !tileCounts;
        }

        // Round to whole tiles, keeping at least the minimum size
        function closestSize(requested, minimum, step) {
            const tiles = Math.max(0, Math.round((requested - minimum) / step));
            return minimum + tiles * step;
        }

        function updatePreview() {
            // Leave placeholders while a field is empty or invalid
            if (inputs.some(input => !Number.isFinite(input.valueAsNumber))) {
                preview.textContent = '— × — × — blocks';
                details.textContent = '';
                tileCounts = null;
                download.textContent = 'Download schematic';
                updateButton();
                return;
            }

            // Calculate each axis using its own minimum and tile increment
            const sizes = inputs.map(input => closestSize(
                input.valueAsNumber, Number(input.min), Number(input.step)
            ));
            preview.textContent = `${sizes.join(' × ')} blocks`;

            // Convert the rounded outer dimensions into Python's tile counts
            const slices = (sizes[0] - wBase) / wSlice;
            const layers = (sizes[1] - hBase) / hSlice;
            tileCounts = {
                widthTiles: slices,
                heightLayers: layers,
                lengthTiles: (sizes[2] - lBase) / lSlice,
            };
            details.textContent = `${slices} ice maker ${slices === 1 ? 'slice' : 'slices'} · ${layers} ${layers === 1 ? 'layer' : 'layers'} · ${sizes[2] - lBase} armor stands`;
            download.textContent = `Download ${sizes.join(' × ')} schematic`;
            updateButton();
        }

        // Refresh on typing and arrow clicks, and show the starting size on load
        inputs.forEach(input => input.addEventListener('input', updatePreview));
        updatePreview();

        // Keep Python generation off the page's main thread
        const worker = new Worker('./generator-worker.js', { type: 'module' });
        download.onclick = () => {
            if (failed || busy || !tileCounts) return;
            busy = true;
            inputs.forEach(input => { input.disabled = true; });
            updateButton();
            status.textContent = 'Generating schematic…';
            // Hold an early click until Python finishes loading
            if (ready) worker.postMessage(tileCounts);
            else pendingRequest = { ...tileCounts };
        };

        // Restore the controls after generation succeeds or fails
        function finish() {
            busy = false;
            inputs.forEach(input => { input.disabled = false; });
            updateButton();
        }

        worker.onmessage = ({ data }) => {
            if (data.type === 'ready') {
                ready = true;
                // Send the waiting request without exposing the startup phase
                if (pendingRequest) {
                    worker.postMessage(pendingRequest);
                    pendingRequest = null;
                }
                updateButton();
            } else if (data.type === 'error') {
                if (!ready) failed = true;
                pendingRequest = null;
                status.textContent = data.message;
                finish();
            } else if (data.type === 'complete') {
                // Wrap the returned bytes in a downloadable browser file
                const blob = new Blob([data.bytes], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = data.filename;
                document.body.append(link);
                link.click();
                link.remove();

                // Release the temporary URL after starting the download
                setTimeout(() => URL.revokeObjectURL(url), 60_000);
                status.textContent = 'Schematic generated';
                finish();
            }
        };

        // Report failures that prevent the worker itself from running
        worker.onerror = () => {
            ready = false;
            failed = true;
            pendingRequest = null;
            status.textContent = 'Generator could not start. Reload the page to try again.';
            finish();
        };
    </script>

</body>

</html>
